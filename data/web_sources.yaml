# Liste des URLs scrapées lors de l'ingestion.
#
# Format :
# - url: <URL absolue>
#   domaine: travail | foncier | famille | commercial | administratif | penal | fiscal | numerique
#   source: "Libellé humain affiché dans les sources citées"
#   discover_pdfs: true|false   # optionnel: crawl du site pour trouver des liens PDF
#   crawl_max_pages: 20         # optionnel
#   crawl_max_pdfs: 30          # optionnel
#   crawl_max_depth: 2          # optionnel
#
# Avant d'ajouter une URL, vérifier :
#  1. que le site autorise le scraping (robots.txt, CGU) ;
#  2. que la page cible contient du contenu stable (éviter les pages de résultats
#     dynamiques, les formulaires, les PDFs embedded — pour les PDFs, utiliser
#     data/pdfs/ à la place).
#
# Laisser ce fichier vide (ou avec des entrées commentées) n'empêche pas
# l'ingestion des autres sources de fonctionner.

